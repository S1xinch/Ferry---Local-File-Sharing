name: Release

# Push a tag like v0.2.0 to build the apps and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/build.sh windows linux
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: dist/*

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/build.sh mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  publish:
    needs: [windows-linux, mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Windows:** download `ferry-windows-x64.exe` and double-click it.
            **Mac:** download `ferry-mac.zip`, unzip it, and move Ferry to Applications.

            The first time you open it your computer will warn you because the app is not from a paid developer account. See the README for the one-time steps.
